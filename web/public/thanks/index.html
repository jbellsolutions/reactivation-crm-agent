<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're In</title>
<meta name="description" content="Your first month is paid.">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <p class="small">Step 3 of 3</p>
  <h1 id="h">Checking your payment</h1>
  <p id="p" class="lede"></p>
</main>
<script>
  const sid = new URLSearchParams(location.search).get("session_id") || "";
  const h = document.getElementById("h"), p = document.getElementById("p");
  (async () => {
    const r = await fetch("/api/paid", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ session_id: sid }) });
    const out = await r.json().catch(() => ({}));
    if (r.ok) { h.textContent = "You're in."; p.textContent = "Your first month is paid. We'll be in touch to set everything up with you."; }
    else { h.textContent = "Almost there"; p.textContent = out.error || "We couldn't confirm your payment."; }
  })();
</script>
</body>
</html>
